<style>:root{
  --bg1:#F1E4CC;--bg2:#E9D5B5;--ink:#3B281F;--ink2:#654936;--mute:#8A725E;
  --card:rgba(255,250,240,.82);--card-b:rgba(255,248,232,.94);--line:rgba(59,40,31,.16);
  --accent:#75452F;--accent2:#C18A4D;--accent-ink:#fffaf0;
  --ok:#14804a;--warn:#b26a00;--bad:#b3261e;--info:#2a5fa8;--viol:#6b4fb3;
  --c-xag:#0e8f8a;--c-q:#d99a1e;--c-far:#8a97a3;--c-amb:#7b5fc7;--c-s:#4d7fb8;
  --shadow:5px 6px 18px rgba(83,55,34,.12),-4px -4px 14px rgba(255,250,240,.85);
  --shadow-in:inset 2px 2px 6px rgba(83,55,34,.12),inset -2px -2px 6px rgba(255,250,240,.8);
  --radius:18px;--fs:16px;
  --serif:"Noto Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg1:#0d141b;--bg2:#101c22;--ink:#e6edf3;--ink2:#a9b8c6;--mute:#7d8d9b;
  --card:rgba(30,42,52,.55);--card-b:rgba(255,255,255,.08);--line:rgba(255,255,255,.10);
  --accent:#38c4bb;--accent2:#e5a93c;--accent-ink:#06201f;
  --ok:#4cc38a;--warn:#e5a93c;--bad:#ff7b72;--info:#6fa8f0;--viol:#a592f0;
  --c-xag:#38c4bb;--c-q:#e5a93c;--c-far:#8795a3;--c-amb:#a592f0;--c-s:#6fa8f0;
  --shadow:8px 8px 22px rgba(0,0,0,.45),-4px -4px 14px rgba(255,255,255,.03);
  --shadow-in:inset 2px 2px 6px rgba(0,0,0,.5),inset -2px -2px 6px rgba(255,255,255,.04);
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:var(--sans);color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;line-height:1.5;-webkit-text-size-adjust:100%}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.45;pointer-events:none}
body::before{width:42vw;height:42vw;left:-10vw;top:-10vw;background:radial-gradient(circle,var(--accent),transparent 70%)}
body::after{width:38vw;height:38vw;right:-8vw;bottom:-10vw;background:radial-gradient(circle,var(--accent2),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;display:flex;flex-direction:column;gap:6px;background:var(--card);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border-right:1px solid var(--card-b);z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:var(--accent-ink);font-family:var(--serif);font-weight:700;font-size:1.25rem;box-shadow:var(--shadow)}
.brand b{display:block;font-family:var(--serif);font-size:1.02rem;line-height:1.15}
.brand small{color:var(--mute);font-size:.72rem}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:12px;background:transparent;cursor:pointer;color:var(--ink2);font-weight:550}
.nav button:hover{background:var(--card-b)}
.nav button[aria-current="page"]{background:var(--card-b);color:var(--ink);box-shadow:var(--shadow-in)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;font-size:.72rem;color:var(--mute);padding:8px}
.main{padding:22px clamp(14px,3vw,34px) 80px;min-width:0}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-size:1.7rem;margin:0}
.top .sub{color:var(--mute);font-size:.9rem}
.menu-btn{display:none}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--card-b);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{font-family:var(--serif);font-size:1.15rem;margin:0 0 10px}
.card h3{font-size:.95rem;margin:14px 0 6px;color:var(--ink2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font-size:1.9rem;font-family:var(--serif)}.stat span{color:var(--mute);font-size:.82rem}
.btn{border:1px solid var(--line);background:var(--card-b);padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600;box-shadow:var(--shadow);display:inline-flex;gap:8px;align-items:center}
.btn:hover{transform:translateY(-1px)}.btn:active{box-shadow:var(--shadow-in);transform:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=number],input[type=password],input[type=url],select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card-b);box-shadow:var(--shadow-in);outline:none}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:.85rem;color:var(--ink2);margin:10px 0 4px;font-weight:600}
textarea.poem{min-height:46vh;font-family:var(--serif);font-size:1.18rem;line-height:1.75;resize:vertical;white-space:pre;overflow:auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:650;border:1px solid var(--line);background:var(--card-b);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.chip.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent)}
.chip.viol{color:var(--viol);border-color:color-mix(in srgb,var(--viol) 40%,transparent)}
.chip.mute{color:var(--mute)}
.note{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:.86rem;color:var(--ink2)}
.note.info{background:color-mix(in srgb,var(--info) 10%,transparent);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.note.bad{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);position:sticky;top:0;background:var(--card-b);backdrop-filter:blur(8px)}
.scroll{overflow:auto;max-height:62vh;border-radius:12px}
tr.line{cursor:pointer}tr.line:hover{background:var(--card-b)}tr.line.sel{background:color-mix(in srgb,var(--accent) 16%,transparent)}
tr.line td.txt{font-family:var(--serif);font-size:1.02rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;padding:7px 13px;border-radius:10px;background:transparent;cursor:pointer;color:var(--ink2);font-weight:600}
.tabs button[aria-selected=true]{background:var(--card-b);box-shadow:var(--shadow-in);color:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}.kv dt{color:var(--mute)}.kv dd{margin:0}
.meter{overflow-x:auto;padding:6px 0}.meter svg{display:block;min-width:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .15s}
.progress{position:fixed;left:0;right:0;top:0;height:4px;z-index:100;display:none}.progress.on{display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg1);z-index:100;box-shadow:var(--shadow);max-width:90vw}
.kbcard{border-left:4px solid var(--line);padding-left:12px}.kbcard.sugan{border-color:var(--ok)}.kbcard.qayb-sugan{border-color:var(--info)}.kbcard.muran{border-color:var(--bad)}.kbcard.aan-la-xaqiijin{border-color:var(--warn)}
.poemline{font-family:var(--serif);font-size:1.1rem}
.cmp{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;align-items:center;font-size:.88rem}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}.skip{color:var(--warn);font-weight:700}
details summary{cursor:pointer;font-weight:600}
.tag-sel{outline:2px solid var(--accent)}
#printRoot{display:none}
@media (max-width:980px){.split{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;transform:translateX(-105%);transition:transform .2s;height:100vh}
  .side.open{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.35)}
  .menu-btn{display:inline-flex}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .top h1{font-size:1.4rem}
  textarea.poem{min-height:38vh;font-size:1.08rem}
}
@media print{
  body{background:#fff;color:#000}body::before,body::after{display:none}
  .app{display:none!important}#printRoot{display:block!important}
  #printRoot *{color:#000!important;background:#fff!important;box-shadow:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Jaantuska Gaarriye */
.gch{margin:8px 0 14px;padding:10px;border:1px solid var(--line,rgba(127,127,127,.3));border-radius:12px}
.gwrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.gbox{border:1px solid var(--line,rgba(127,127,127,.4));border-radius:8px;overflow:hidden;min-width:96px}
.gtitle{font-size:.72rem;opacity:.7;padding:3px 8px;border-bottom:1px solid var(--line,rgba(127,127,127,.3))}
.grow{padding:4px 10px;font-family:ui-monospace,monospace;font-size:.9rem;border-top:1px solid var(--line,rgba(127,127,127,.2));white-space:nowrap}
.grow.hit{background:var(--c-xag);color:#fff;font-weight:700}
.gmid,.gtail{text-align:center}
.gx{display:inline-block;min-width:30px;padding:6px 8px;border-radius:8px;background:var(--c-q);color:#111;font-weight:700;font-family:ui-monospace,monospace}
.gxl{font-size:.7rem;opacity:.75;margin-top:2px}
.gnote{font-size:.8rem;opacity:.8}
.gline{border-bottom:1px solid var(--line,rgba(127,127,127,.2));padding:6px 0}

/* poem input collapse + two-card result */
.card.collapsed{display:none}
.ibar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
.ibar[hidden]{display:none}
.ibt{font-family:var(--serif);font-weight:600}
@media (min-width:981px){

}

/* Jaantusyada sanduuq (sida buugga) */
.gfigwrap{margin:10px 0 16px}
.gfig{display:flex;align-items:center;gap:0;overflow-x:auto;padding:16px 8px 10px}
.gcell{position:relative;display:flex;align-items:center}
.gmark{position:absolute;top:-16px;left:6px;font-weight:800}
.gbx{border:2px solid var(--ink,#222);display:flex;flex-direction:column;min-width:56px;background:transparent}
.gbx.gcols{flex-direction:row}
.gcol{display:flex;flex-direction:column;flex:1}
.gbx .grow{padding:5px 10px;text-align:center;font-family:ui-monospace,monospace;font-size:.88rem;white-space:nowrap;border-top:1px solid var(--line,rgba(127,127,127,.35))}
.gbx .grow:first-child{border-top:0}
.gbx.core .grow{font-weight:700}
.glk{align-self:center;border-top:2px solid var(--ink,#222);border-bottom:2px solid var(--ink,#222);padding:12px 10px;min-width:36px;text-align:center;font-weight:700;font-family:ui-monospace,monospace;margin:0 -1px}
.glk.dig{border:2px solid var(--ink,#222)}
.grow.hit,.glk.hit{background:var(--c-xag);color:#fff}
.gscan{font-size:.85rem;opacity:.85;padding:0 8px}

.split.listcol{grid-template-columns:56px minmax(0,1fr)}
.listcard.col{padding:8px;text-align:center}

    if (k === nuc.length - 1) codaEnd = n;

      const u = units(x.e + 1, nuc[k + 1].s);

/* Habka ilaha: 'all' = dhammaan buugaagta; 'G' = 100% Gaarriye (Mahadho) — kaliya jaanta Gaarriye caddeeyey */
const G_IDS = ['gabay', 'jiifto', 'cawsk', 'haan', 'mullaax', 'maqal', 'caddalool', 'saar', 'sabaale', 'xerta', 'herimaahee', 'kabad1', 'kabad2', 'kabad3', 'geeraar'];
let SRC_MODE = 'all';
function setSourceMode(m) { SRC_MODE = m === 'G' ? 'G' : 'all'; if (SRC_MODE === 'G') DIPH_MODE = 'gaarriye'; }
function getSourceMode() { return SRC_MODE; }
function activeProfiles() { return SRC_MODE === 'G' ? PROFILES.filter(p => G_IDS.indexOf(p.id) >= 0) : PROFILES; }
const PROFILE_BY_ID = {}; PROFILES.forEach(p => PROFILE_BY_ID[p.id] = p);

/* hooris (Cali Ileeye p.62) — used only to describe gabay's second half */
const HOORIS = [X, q, X, X, q];

/* ---------- matcher (backtracking, 'V' = ambiguous 1|2) ---------- */
function matchTokens(tokens, seq) {
  const n = seq.length;
  function rec(ti, pos, acc) {
    if (ti === tokens.length) return pos === n ? acc : null;
    const t = tokens[ti], s = seq[pos];
    if (pos >= n) return null;
    if (t === 'X') {
      if (s === 2 || s === 'V') { const r = rec(ti + 1, pos + 1, acc.concat([{ t: 'X', v: [2], i: pos }])); if (r) return r; }
      if ((s === 1 || s === 'V') && pos + 1 < n && (seq[pos + 1] === 1 || seq[pos + 1] === 'V')) {
        const r = rec(ti + 1, pos + 2, acc.concat([{ t: 'X', v: [1, 1], i: pos }])); if (r) return r;
      }
      return null;
    }
    if (t === 'q' || t === '1') { if (s === 1 || s === 'V') return rec(ti + 1, pos + 1, acc.concat([{ t: t === 'q' ? 'q' : 'L', v: [1], i: pos }])); return null; }
    if (t === '2') { if (s === 2 || s === 'V') return rec(ti + 1, pos + 1, acc.concat([{ t: 'L', v: [2], i: pos }])); return null; }
    if (t === '11') { if ((s === 1 || s === 'V') && pos + 1 < n && (seq[pos + 1] === 1 || seq[pos + 1] === 'V')) return rec(ti + 1, pos + 2, acc.concat([{ t: 'L', v: [1, 1], i: pos }])); return null; }
    if (t === 'S') { return rec(ti + 1, pos + 1, acc.concat([{ t: 'S', v: [s === 'V' ? 2 : s], i: pos }])); }
    return null;
  }
  return rec(0, 0, []);
}

function matchProfile(profile, seq, firstWordIdx) {
  // exact
  for (const v of profile.variants) {
    const r = matchTokens(v, seq);
    if (r) return { profile, parse: r, farcame: null, tokens: v };
  }
  // farcame (extra short vowel in the FIRST word — Cali Ileeye p.32-33)
  for (const r0 of firstWordIdx) {
    if (seq[r0] === 2) continue;
    const seq2 = seq.slice(0, r0).concat(seq.slice(r0 + 1));
    for (const v of profile.variants) {
      const r = matchTokens(v, seq2);
      if (r) {
        // re-map indices to the original seq
        r.forEach(el => { el.i = el.i >= r0 ? el.i + 1 : el.i; });
        return { profile, parse: r, farcame: r0, tokens: v };
      }
    }
  }
  return null;
}

/* ---------- line analysis ---------- */
function analyzeLine(text, opts) {
  opts = opts || {};
  const toks = tokenizeLine(text);
  const words = toks.map(t => t.skipped ? { raw: t.raw, skipped: true, nuclei: [], sylls: [] } : Object.assign({ skipped: false }, analyzeWord(t.raw)));
  const flat = []; // {w: wordIdx, n: nucleusIdx, v}
  words.forEach((w, wi) => { if (!w.skipped) w.nuclei.forEach((x, ni) => flat.push({ w: wi, n: ni, v: x.v, rule: x.rule })); });
  const seq = flat.map(f => f.v);
  const firstWordIdx = [];
  const fw = flat.length ? flat[0].w : -1;
  flat.forEach((f, i) => { if (f.w === fw) firstWordIdx.push(i); });
  const min = seq.reduce((a, v) => a + (v === 'V' ? 1 : v), 0);
  const max = seq.reduce((a, v) => a + (v === 'V' ? 2 : v), 0);
  const vCount = seq.filter(v => v === 'V').length;
  const longCount = seq.filter(v => v === 2).length;
  const res = {
    text, words, flat, seq, empty: seq.length === 0,
    alan: seq.length, unitsMin: min, unitsMax: max, ambiguous: vCount > 0, vCount, longCount,
    matches: [], closest: null
  };
  if (res.empty) return res;
  const all = [];
  activeProfiles().forEach(p => { const m = matchProfile(p, seq, firstWordIdx); if (m) all.push(m); });
  all.sort((a, b) => (a.farcame === null ? 0 : 1) - (b.farcame === null ? 0 : 1));
  const strictOnly = all.filter(m => m.farcame === null);
  res.suppressedFarcame = strictOnly.length ? all.length - strictOnly.length : 0;
  res.matches = (strictOnly.length ? strictOnly : all).map(m => describeMatch(m, res));
  if (!all.length) res.closest = closestProfile(res, firstWordIdx);
  res.alliteration = alliterationOfLine(words);
  res.ending = lineEnding(words);
  return res;
}

function seqToStr(seq) { return seq.map(v => v === 'V' ? '1/2' : String(v)).join(' '); }

function describeMatch(m, line) {
  const p = m.profile;
  // resolved values & xag/qodob rendering
  const parts = [];
  m.parse.forEach(el => {
    const vals = el.v.map(x => x).join('');
    if (el.t === 'X') parts.push('[' + (el.v.length === 2 ? '11' : '2') + ']');
    else if (el.t === 'q') parts.push('(1)');
    else parts.push(el.v.join(''));
  });
  if (m.farcame !== null) parts.unshift('{1}');
  const units = m.parse.reduce((a, el) => a + el.v.reduce((s, x) => s + x, 0), 0) + (m.farcame !== null ? 1 : 0);
  const out = { id: p.id, nameSo: p.nameSo, units, farcame: m.farcame, notation: parts.join(' '), status: p.status, src: p.src, pages: p.pages, parse: m.parse };
  if (p.id === 'gabay') {
    const hoj = m.parse.slice(0, 7), hor = m.parse.slice(7);
    const su = a => a.reduce((s, el) => s + el.v.reduce((x, y) => x + y, 0), 0);
    out.hojis = su(hoj); out.hooris = su(hor);
    out.hojisN = hoj.reduce((s, el) => s + el.v.length, 0); out.hoorisN = hor.reduce((s, el) => s + el.v.length, 0);
    out.hojisLong = hoj.reduce((s, el) => s + el.v.filter(x => x === 2).length, 0);
    out.hoorisLong = hor.reduce((s, el) => s + el.v.filter(x => x === 2).length, 0);
  }
  // dheellitir (alan, long count) excluding farcame
  const resolved = m.parse.reduce((a, el) => a.concat(el.v), []);
  out.dheellitir = [resolved.length, resolved.filter(x => x === 2).length];
  out.resolved = resolved;
  if (p.id === 'jiifto') out.closedWarn = jiiftoClosedWarnings(line, m);
  return out;
}

/* ===== DATA LAYER: IndexedDB + API adapter (local fallback) + secure import/backup ===== */
(function (root) {
'use strict';

const NAME = 'somali_poetry_analyzer_v1';
const STORES = ['projects', 'poems', 'analyses', 'knowledge', 'materials', 'settings', 'validation', 'reports'];
const LIMITS = { file: 25 * 1024 * 1024, text: 5 * 1024 * 1024, record: 4 * 1024 * 1024 };

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function now() { return new Date().toISOString(); }
function clean(v) { // strip dangerous keys (prototype pollution) from untrusted JSON
  if (Array.isArray(v)) return v.map(clean);
  if (v && typeof v === 'object') { const o = {}; Object.keys(v).forEach(k => { if (k === '__proto__' || k === 'constructor' || k === 'prototype') return; o[k] = clean(v[k]); }); return o; }
  return v;
}
function safeParse(txt) { return clean(JSON.parse(txt)); }

/* ---------- IndexedDB (with in-memory fallback — clearly reported) ---------- */
const DB = (function () {
  let db = null, mem = null, mode = 'indexeddb';
  function fallback(why) { mode = 'memory'; mem = {}; STORES.forEach(s => mem[s] = new Map()); DB.why = why; }
  const api = {
    why: '',
    get mode() { return mode; },
    open() {
      return new Promise(res => {
        try {
          if (!root.indexedDB) { fallback('IndexedDB lama helin'); return res(false); }
          const r = indexedDB.open(NAME, 1);
          r.onupgradeneeded = () => { STORES.forEach(s => { if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' }); }); };
          r.onsuccess = () => { db = r.result; res(true); };
          r.onerror = () => { fallback('IndexedDB waa la diiday (' + (r.error && r.error.name) + ')'); res(false); };
          r.onblocked = () => { fallback('IndexedDB waa la xidhay'); res(false); };
        } catch (e) { fallback(String(e && e.message || e)); res(false); }
      });
    },
    _tx(store, rw, fn) {
      return new Promise((resolve, reject) => {
        const t = db.transaction(store, rw ? 'readwrite' : 'readonly');
        const st = t.objectStore(store);
        const r = fn(st);
        t.oncomplete = () => resolve(r && r.result !== undefined ? r.result : undefined);
        t.onerror = () => reject(t.error); t.onabort = () => reject(t.error || new Error('abort'));
      });
    },
    async put(store, obj) {
      if (!obj.id) obj.id = uid();
      if (JSON.stringify(obj).length > LIMITS.record) throw new Error('Diiwaanku aad buu u weyn yahay');
      if (mode === 'memory') { mem[store].set(obj.id, JSON.parse(JSON.stringify(obj))); return obj; }
      await this._tx(store, true, s => s.put(obj)); return obj;
    },
    async get(store, id) { if (mode === 'memory') return mem[store].get(id) || null; return (await this._tx(store, false, s => s.get(id))) || null; },
    async del(store, id) { if (mode === 'memory') { mem[store].delete(id); return; } await this._tx(store, true, s => s.delete(id)); },
    async all(store) { if (mode === 'memory') return Array.from(mem[store].values()); return (await this._tx(store, false, s => s.getAll())) || []; },
    async clear(store) { if (mode === 'memory') { mem[store].clear(); return; } await this._tx(store, true, s => s.clear()); },
    async count(store) { if (mode === 'memory') return mem[store].size; return (await this._tx(store, false, s => s.count())) || 0; },
    async search(store, pred) { return (await this.all(store)).filter(pred); }
  };
  return api;
})();

/* ---------- Local adapter ---------- */
const LocalAdapter = {
  name: 'local',
  list: s => DB.all(s), get: (s, id) => DB.get(s, id),
  save: (s, o) => { o.updated = now(); if (!o.created) o.created = o.updated; return DB.put(s, o); },
  remove: (s, id) => DB.del(s, id), count: s => DB.count(s)
};

/* ---------- Remote adapter (REST contract; needs a backend you provide) ---------- */
const RemoteAdapter = {
  name: 'remote', base: '', token: '',
  configured() { return !!this.base; },
  async _f(path, opt) {
    if (!this.configured()) throw new Error('Backend lama habeyn');
    const h = { 'Content-Type': 'application/json' }; if (this.token) h.Authorization = 'Bearer ' + this.token;
    const r = await fetch(this.base.replace(/\/+$/, '') + path, Object.assign({ headers: h, credentials: 'omit' }, opt));
    if (!r.ok) throw new Error('Backend: HTTP ' + r.status);
    return r.status === 204 ? null : r.json();
  },
  list(s) { return this._f('/api/' + s); }, get(s, id) { return this._f('/api/' + s + '/' + encodeURIComponent(id)); },
  save(s, o) { return this._f('/api/' + s + '/' + encodeURIComponent(o.id || uid()), { method: 'PUT', body: JSON.stringify(o) }); },
  remove(s, id) { return this._f('/api/' + s + '/' + encodeURIComponent(id), { method: 'DELETE' }); },
  count(s) { return this.list(s).then(a => a.length); },
  ping() { return this._f('/api/health'); }
};

/* Data facade: uses remote only if enabled; on failure falls back to local (never pretends local = cloud) */
const Data = {
  useRemote: false, lastWarn: '',

    if (this.useRemote && RemoteAdapter.configured()) {
      try { const r = await RemoteAdapter[m](...args); this.lastWarn = ''; if (m === 'save' || m === 'remove') await LocalAdapter[m](...args).catch(() => {}); return r; }
      catch (e) { this.lastWarn = 'Backend ma shaqayn — waxaa la isticmaalay keydka degaanka (' + e.message + ')'; }
    }
    return LocalAdapter[m](...args);
  },
  list(s) { return this._do('list', [s]); }, get(s, id) { return this._do('get', [s, id]); },
  save(s, o) { return this._do('save', [s, o]); }, remove(s, id) { return this._do('remove', [s, id]); }, count(s) { return this._do('count', [s]); }
};

/* ---------- checksum (FNV-1a 32) ---------- */
function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }

  return { format: 'somali-poetry-analyzer-backup', version: 1, created: now(), checksum: fnv(body), counts: Object.fromEntries(Object.keys(stores).map(k => [k, stores[k].length])), stores };

    const m = line.matches.find(x => x.id === dominantId);

    strs.forEach(s => { let k = 0; while (k < s.length && k < line.seq.length && (line.seq[k] === 'V' || line.seq[k] === s[k])) k++; if (k > bp) { bp = k; best = s; } });
    return best ? { id: dominantId, arr: best, exact: false } : null;
  }
  if (line.closest && line.closest.expected) return { id: line.closest.id, arr: line.closest.expected, exact: false };
  return null;
}

function noteCompute(text, prev) {
  const l = E.analyzeLine(text); const ids = l.matches.map(m => m.id); let msg = null;
  if (!l.empty) {
    const pi = (prev && !prev.empty && prev.ids) || []; const dlt = prev && !prev.empty ? l.unitsMax - prev.max : 0;
    const rng = l.unitsMin === l.unitsMax ? String(l.unitsMin) : l.unitsMin + '–' + l.unitsMax;
    if (ids.length) {
      if (pi.length && !pi.some(x => ids.includes(x))) msg = { k: 'warn', t: 'Xeerka ' + pi.map(noteName).join(' / ') + ' waa la jabiyay' + (dlt ? ' (' + (dlt > 0 ? '+' : '') + dlt + ' shaqal)' : '') + ' — hadda waa god kale: ' + l.matches.map(m => noteName(m.id) + ' ' + m.units).join(' / ') + '.' };
      else msg = { k: 'ok', t: 'Waafaqsan: ' + l.matches.map(m => noteName(m.id) + ' ' + m.units).join(' / ') + ' (' + rng + ' shaqal).' };
    } else {

      msg = { k: 'bad', t: (pi.length ? 'Shaqal ' + (dlt > 0 ? 'lagu daray' : dlt < 0 ? 'laga jaray' : 'la beddelay') + ' ayaa jabiyay xeerka ' + pi.map(noteName).join(' / ') + '. ' : 'Jaan ma dhigmin. ') + 'Dherer: ' + rng + ' shaqal.' + (c ? ' Ugu dhow: ' + c.nameSo + ' (' + c.expectedUnits + ' shaqal)' + (c.unitsDiff ? ', farqi ' + c.unitsDiff + ' shaqal' : ', dherer waa isku mid laakiin jaanta waa ka duwan tahay') + (c.firstMismatch != null ? '; jabku wuxuu ka bilaabmaa shaqalka #' + (c.firstMismatch + 1) : '') + '.' : '') };

}
